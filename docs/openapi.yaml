      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcome'
          description: ''
  /api/v1/submissions:
    post:
      operationId: submissions_create
      description: |-
        Submit the numbers for one polling unit (spec section 10). Sending the same
        `version_id` again (a retry or a double tap) is safe: it returns the stored outcome with
        `replayed: true` and never creates a second result. The response status is the outcome's
        `http_status`; refused submissions say why in `code` and `detail`.
      tags:
      - submissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionOutcome'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionOutcome'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionOutcome'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionOutcome'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionOutcome'
          description: ''
  /api/v1/submissions/{version_id}:
    get:
      operationId: submissions_retrieve
      description: |-
        One of my submissions: its review state, whether the sheet is attached, and why it was
        rejected if it was.
      parameters:
      - in: path
        name: version_id
