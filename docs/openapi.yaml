openapi: 3.0.3
info:
  title: VTRS API
  version: 1.0.0
  description: Vote Tracking & Recording Solution. Results shown are provisional party
    data, never an official declaration.
paths:
  /api/v1/admin/alert-policy:
    get:
      operationId: admin_alert_policy_retrieve
      description: |-
        Who is told about flags, how, and how long they have before it escalates. GET shows
        the matrix in force; PUT overrides severities (fresh second factor); DELETE restores the
        platform defaults.
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
          description: ''
    put:
      operationId: admin_alert_policy_update
      description: |-
        Who is told about flags, how, and how long they have before it escalates. GET shows
        the matrix in force; PUT overrides severities (fresh second factor); DELETE restores the
        platform defaults.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertPolicyUpdateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
          description: ''
    delete:
      operationId: admin_alert_policy_destroy
      description: |-
        Who is told about flags, how, and how long they have before it escalates. GET shows
        the matrix in force; PUT overrides severities (fresh second factor); DELETE restores the
        platform defaults.
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
          description: ''
  /api/v1/admin/data-quality:
    get:
      operationId: admin_data_quality_retrieve
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQuality'
          description: ''
  /api/v1/admin/health:
    get:
      operationId: admin_health_retrieve
      description: Infrastructure checks and this organization's work in flight.
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/assignments:
    get:
      operationId: assignments_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - assignments
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
    post:
      operationId: assignments_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/assignments/{assignment_id}/revoke:
    post:
      operationId: assignments_revoke_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assignments
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/audit/events:
    get:
      operationId: audit_events_list
      description: |-
        The organization's audit trail, newest first. Defaults to the last 24 hours; the window
        is at most 31 days.
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Action prefix, e.g. result.
      - in: query
        name: actor_id
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
        description: ISO timestamp, default 24 h before until
      - in: query
        name: until
        schema:
          type: string
        description: ISO timestamp, default now
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/invitations/accept:
    post:
      operationId: auth_invitations_accept_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
          description: ''
  /api/v1/auth/invitations/complete:
    post:
      operationId: auth_invitations_complete_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCompleteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
