components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
      required:
      - access_expires_at
      - access_token
    ActiveRevokedStatusEnum:
      enum:
      - ACTIVE
      - REVOKED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `REVOKED` - Revoked
    AlertPolicy:
      type: object
      properties:
        overridden:
          type: boolean
        override:
          type: object
          additionalProperties: {}
        effective:
          type: object
          additionalProperties: {}
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - effective
      - overridden
      - override
      - updated_at
    AlertPolicyUpdateRequest:
      type: object
      description: Rejects fields the serializer does not declare (spec section 9).
      properties:
        matrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
      required:
      - matrix
    Analytics:
      type: object
      properties:
        election_id:
          type: string
          format: uuid
        invitations:
          type: object
          additionalProperties: {}
        assignment:
          type: object
          additionalProperties: {}
        capture:
          type: object
          additionalProperties: {}
        sync:
          type: object
          additionalProperties: {}
        evidence:
          type: object
          additionalProperties: {}
        integrity:
          type: object
          additionalProperties: {}
      required:
      - assignment
      - capture
      - election_id
      - evidence
      - integrity
      - sync
    AreaResult:
      type: object
      description: |-
        One area's figures. `votes` and `totals` follow `measure`; the polling-unit counts
        for both measures are always present.
      properties:
        level:
          type: string
        area_id:
          type: string
          format: uuid
        area_name:
          type: string
        area_code:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        expected_pus:
          type: integer
        reported_pus:
          type: integer
