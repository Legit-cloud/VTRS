components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
      required:
      - access_expires_at
      - access_token
    ActiveRevokedStatusEnum:
      enum:
      - ACTIVE
      - REVOKED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `REVOKED` - Revoked
    AssignedElection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        election_date:
          type: string
          format: date
        status:
          type: string
        capture_open:
          type: boolean
        config_version:
          type: integer
        polls_open_at:
          type: string
          format: date-time
          nullable: true
        polls_close_at:
          type: string
          format: date-time
          nullable: true
      required:
      - capture_open
      - config_version
      - election_date
      - id
