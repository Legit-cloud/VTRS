        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/candidates/{candidate_id}:
    get:
      operationId: candidates_retrieve
      parameters:
      - in: path
        name: candidate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
    patch:
      operationId: candidates_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: ETag from your last read
        required: true
      - in: path
        name: candidate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCandidateUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
    delete:
      operationId: candidates_destroy
      parameters:
      - in: path
        name: candidate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/contests/{contest_id}:
    get:
      operationId: contests_retrieve
      parameters:
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contests
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contest'
          description: ''
    patch:
      operationId: contests_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: ETag from your last read
        required: true
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContestUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contest'
          description: ''
    delete:
      operationId: contests_destroy
      parameters:
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contests
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/contests/{contest_id}/candidates:
    get:
      operationId: contests_candidates_list
      parameters:
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contests
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
          description: ''
    post:
      operationId: contests_candidates_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
  /api/v1/contests/{contest_id}/coverage-timeline:
    get:
      operationId: contests_coverage_timeline_retrieve
      parameters:
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: interval
        schema:
          type: string
          enum:
          - hour
          - minute
      - in: query
        name: parent_id
        schema:
          type: string
      tags:
      - contests
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageTimeline'
          description: ''
  /api/v1/contests/{contest_id}/polling-units/{polling_unit_id}/history:
    get:
      operationId: contests_polling_units_history_retrieve
      description: Every version a polling unit's result has had for one contest,
        oldest first.
      parameters:
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: polling_unit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contests
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuHistory'
          description: ''
  /api/v1/contests/{contest_id}/results:
    get:
      operationId: contests_results_retrieve
      description: |-
        Drill-down: LGA scorecards, ward lists and polling-unit lists for one contest. Omit
        `level` to start at the top of the caller's own scope.
      parameters:
      - in: path
        name: contest_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: level
        schema:
          type: string
          enum:
          - lga
          - pu
          - state
          - ward
      - in: query
        name: measure
        schema:
          type: string
          enum:
          - reported
          - verified
        description: reported (every counting result) or verified (approved results
          only). Defaults to the election's count policy.
      - in: query
        name: parent_id
        schema:
          type: string
        description: The area one level up
      tags:
      - contests
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestResults'
          description: ''
  /api/v1/elections:
    get:
      operationId: elections_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedElectionList'
          description: ''
    post:
      operationId: elections_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
  /api/v1/elections/{election_id}:
    get:
      operationId: elections_retrieve
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
    patch:
      operationId: elections_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: ETag from your last read
        required: true
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedElectionUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
  /api/v1/elections/{election_id}/analytics:
    get:
      operationId: elections_analytics_retrieve
      description: Onboarding, capture, sync and integrity metrics for one election,
        inside your scope.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
          description: ''
  /api/v1/elections/{election_id}/contests:
    get:
      operationId: elections_contests_list
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contest'
          description: ''
    post:
      operationId: elections_contests_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contest'
          description: ''
  /api/v1/elections/{election_id}/dashboard:
    get:
      operationId: elections_dashboard_retrieve
      description: |-
        War Room: headline figures per contest over everything the caller may see. Figures are
        provisional and based on party-captured data; they are not an official declaration.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: measure
        schema:
          type: string
          enum:
          - reported
          - verified
        description: reported (every counting result) or verified (approved results
          only). Defaults to the election's count policy.
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/elections/{election_id}/flags:
    get:
      operationId: elections_flags_list
      description: Flags for an election inside the caller's scope, newest first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlagList'
          description: ''
  /api/v1/elections/{election_id}/flags/summary:
    get:
      operationId: elections_flags_summary_retrieve
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagSummary'
          description: ''
  /api/v1/elections/{election_id}/lock:
    post:
      operationId: elections_lock_create
      description: Freeze contests and candidates (FR-6.3.3). Needs a fresh second
        factor.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
  /api/v1/elections/{election_id}/reconcile:
    post:
      operationId: elections_reconcile_create
      description: |-
        Freeze the rollups of a closed election and mark it RECONCILED. Needs a fresh second
        factor. Results can no longer change afterwards.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
