components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
      required:
      - access_expires_at
      - access_token
    ActiveRevokedStatusEnum:
      enum:
      - ACTIVE
      - REVOKED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `REVOKED` - Revoked
    AlertPolicy:
      type: object
      properties:
        overridden:
          type: boolean
        override:
          type: object
          additionalProperties: {}
        effective:
          type: object
          additionalProperties: {}
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - effective
      - overridden
      - override
      - updated_at
    AlertPolicyUpdateRequest:
      type: object
      description: Rejects fields the serializer does not declare (spec section 9).
      properties:
        matrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
      required:
      - matrix
    Analytics:
      type: object
      properties:
        election_id:
          type: string
          format: uuid
        invitations:
          type: object
          additionalProperties: {}
        assignment:
          type: object
          additionalProperties: {}
        capture:
          type: object
          additionalProperties: {}
        submission:
          type: object
          additionalProperties: {}
        evidence:
          type: object
          additionalProperties: {}
        integrity:
          type: object
          additionalProperties: {}
      required:
      - assignment
      - capture
      - election_id
      - evidence
      - integrity
      - submission
    AreaResult:
      type: object
      description: |-
        One area's figures. `votes` and `totals` follow `measure`; the polling-unit counts for
        both measures are always present, so "X of Y reported" travels with every total.
      properties:
        level:
          type: string
        area_id:
          type: string
          format: uuid
        area_name:
          type: string
        area_code:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        expected_pus:
          type: integer
        reported_pus:
          type: integer
        verified_pus:
          type: integer
        review_pus:
          type: integer
        reported_pct:
          type: number
          format: double
        verified_pct:
          type: number
          format: double
        counted_pus:
          type: integer
        open_flags:
          type: integer
        registered_voters:
          type: integer
        totals:
          $ref: '#/components/schemas/Totals'
        votes:
          type: array
          items:
            $ref: '#/components/schemas/PartyVote'
        position:
          $ref: '#/components/schemas/Position'
        measure:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        head_version_id:
          type: string
          format: uuid
          nullable: true
        verified:
          type: boolean
        completion:
          type: string
          nullable: true
      required:
      - area_code
      - area_id
      - area_name
      - counted_pus
      - expected_pus
      - level
      - measure
      - open_flags
      - parent_id
      - position
      - registered_voters
      - reported_pct
      - reported_pus
      - review_pus
      - totals
      - updated_at
      - verified_pct
      - verified_pus
      - votes
    AssignRequest:
      type: object
      description: Rejects fields the serializer does not declare (spec section 9).
      properties:
        assignee_id:
          type: string
          format: uuid
          nullable: true
      required:
      - assignee_id
    AssignedElection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        election_type_name:
          type: string
        election_date:
          type: string
          format: date
        status:
          type: string
        capture_open:
          type: boolean
        polls_open_at:
          type: string
          format: date-time
          nullable: true
        polls_close_at:
          type: string
          format: date-time
          nullable: true
      required:
      - capture_open
      - election_date
      - election_type_name
      - id
      - name
      - polls_close_at
      - polls_open_at
      - status
    AssignedPollingUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inec_code:
          type: string
        name:
          type: string
        ward:
          type: string
        lga:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        registered_voters:
          type: integer
          nullable: true
      required:
      - id
      - inec_code
      - latitude
      - lga
      - longitude
      - name
      - registered_voters
      - ward
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        election_id:
          type: string
          format: uuid
          readOnly: true
        agent_id:
          type: string
          format: uuid
          readOnly: true
        agent_name:
          type: string
          readOnly: true
        polling_unit_id:
          type: string
          format: uuid
          readOnly: true
        polling_unit_code:
          type: string
          readOnly: true
        ward_id:
          type: string
          format: uuid
          readOnly: true
        lga_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/ActiveRevokedStatusEnum'
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_id
      - agent_name
      - created_at
      - election_id
      - id
      - lga_id
      - polling_unit_code
      - polling_unit_id
      - ward_id
    AssignmentCreateRequest:
      type: object
      description: Rejects fields the serializer does not declare (spec section 9).
      properties:
        election_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        polling_unit_id:
          type: string
          format: uuid
      required:
      - agent_id
      - election_id
      - polling_unit_id
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        actor_id:
          type: string
          format: uuid
          nullable: true
        actor_role:
          type: string
        ip:
          type: string
          nullable: true
        request_id:
          type: string
        diff:
          type: object
          additionalProperties: {}
      required:
      - action
      - actor_id
      - actor_role
      - at
      - diff
      - id
      - ip
      - object_id
      - object_type
      - request_id
    BallotParty:
      type: object
      properties:
        party_id:
          type: string
          format: uuid
        abbreviation:
          type: string
        full_name:
          type: string
        ballot_order:
          type: integer
        is_own:
          type: boolean
        logo_url:
          type: string
          nullable: true
      required:
      - abbreviation
      - ballot_order
      - full_name
      - is_own
      - logo_url
      - party_id
    ChallengeResponse:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
        destination_hint:
          type: string
      required:
      - challenge_id
    ChannelEnum:
      enum:
      - SMS
      - EMAIL
      type: string
      description: |-
        * `SMS` - SMS
        * `EMAIL` - EMAIL
    CompletionEnum:
      enum:
      - NUMBERS_SUBMITTED
      - COMPLETE
      type: string
      description: |-
        * `NUMBERS_SUBMITTED` - NUMBERS_SUBMITTED
        * `COMPLETE` - COMPLETE
    ConfigIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        election_id:
          type: string
          format: uuid
          readOnly: true
        polling_unit_id:
          type: string
          format: uuid
          readOnly: true
        polling_unit_code:
          type: string
          readOnly: true
        polling_unit_name:
          type: string
          readOnly: true
        ward_name:
          type: string
          readOnly: true
        lga_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/ConfigIssueKindEnum'
        note:
          type: string
        status:
          $ref: '#/components/schemas/ConfigIssueStatusEnum'
        raised_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolution_note:
          type: string
        resolved_by_name:
          type: string
          nullable: true
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - election_id
      - id
      - kind
      - lga_name
      - note
      - polling_unit_code
      - polling_unit_id
      - polling_unit_name
      - raised_by_name
      - resolved_by_name
      - ward_name
    ConfigIssueKindEnum:
      enum:
      - PARTY_MISSING
      - CONTESTANT_MISSING
      type: string
      description: |-
        * `PARTY_MISSING` - PARTY_MISSING
        * `CONTESTANT_MISSING` - CONTESTANT_MISSING
    ConfigIssueReportRequest:
      type: object
      description: Rejects fields the serializer does not declare (spec section 9).
      properties:
        polling_unit_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ConfigIssueKindEnum'
        note:
          type: string
          minLength: 3
          maxLength: 500
      required:
      - kind
      - note
      - polling_unit_id
    ConfigIssueResolveRequest:
      type: object
      description: Rejects fields the serializer does not declare (spec section 9).
      properties:
        note:
          type: string
