openapi: 3.0.3
info:
  title: VTRS API
  version: 1.0.0
  description: Vote Tracking & Recording Solution. Results shown are provisional party
    data, never an official declaration.
paths:
  /api/v1/admin/alert-policy:
    get:
      operationId: admin_alert_policy_retrieve
      description: |-
        Who is told about flags, how, and how long they have before it escalates. GET shows
        the matrix in force; PUT overrides severities (fresh second factor); DELETE restores the
        platform defaults.
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
          description: ''
    put:
      operationId: admin_alert_policy_update
      description: |-
        Who is told about flags, how, and how long they have before it escalates. GET shows
        the matrix in force; PUT overrides severities (fresh second factor); DELETE restores the
        platform defaults.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertPolicyUpdateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
          description: ''
    delete:
      operationId: admin_alert_policy_destroy
      description: |-
        Who is told about flags, how, and how long they have before it escalates. GET shows
        the matrix in force; PUT overrides severities (fresh second factor); DELETE restores the
        platform defaults.
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
          description: ''
  /api/v1/admin/data-quality:
    get:
      operationId: admin_data_quality_retrieve
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQuality'
          description: ''
  /api/v1/admin/health:
    get:
      operationId: admin_health_retrieve
      description: Infrastructure checks and this organization's work in flight.
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/assignments:
    get:
      operationId: assignments_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - assignments
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
    post:
      operationId: assignments_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/assignments/{assignment_id}/revoke:
    post:
      operationId: assignments_revoke_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assignments
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/audit/events:
    get:
      operationId: audit_events_list
      description: |-
        The organization's audit trail, newest first. Defaults to the last 24 hours; the window
        is at most 31 days.
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Action prefix, e.g. result.
      - in: query
        name: actor_id
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
        description: ISO timestamp, default 24 h before until
      - in: query
        name: until
        schema:
          type: string
        description: ISO timestamp, default now
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/invitations/accept:
    post:
      operationId: auth_invitations_accept_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
          description: ''
  /api/v1/auth/invitations/complete:
    post:
      operationId: auth_invitations_complete_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCompleteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/login/mfa:
    post:
      operationId: auth_login_mfa_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/step-up:
    post:
      operationId: auth_mfa_step_up_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/mfa/totp/confirm:
    post:
      operationId: auth_mfa_totp_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirm'
          description: ''
  /api/v1/auth/mfa/totp/setup:
    post:
      operationId: auth_mfa_totp_setup_create
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/auth/organizations:
    post:
      operationId: auth_organizations_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: ''
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: Resend the code for an existing challenge (60-second cooldown,
        hourly budgets).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
  /api/v1/auth/password/forgot:
    post:
      operationId: auth_password_forgot_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
          description: ''
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/config-issues/{issue_id}/resolve:
    post:
      operationId: config_issues_resolve_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: issue_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - config-issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigIssueResolveRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigIssue'
          description: ''
  /api/v1/contestants/{candidate_id}:
    get:
      operationId: contestants_retrieve
      parameters:
      - in: path
        name: candidate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contestants
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contestant'
          description: ''
    patch:
      operationId: contestants_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: ETag from your last read
        required: true
      - in: path
        name: candidate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contestants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContestantUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contestant'
          description: ''
    delete:
      operationId: contestants_destroy
      parameters:
      - in: path
        name: candidate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contestants
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/elections:
    get:
      operationId: elections_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedElectionList'
          description: ''
    post:
      operationId: elections_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
  /api/v1/elections/{election_id}:
    get:
      operationId: elections_retrieve
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
    patch:
      operationId: elections_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: ETag from your last read
        required: true
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedElectionUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
    delete:
      operationId: elections_destroy
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/elections/{election_id}/analytics:
    get:
      operationId: elections_analytics_retrieve
      description: |-
        Onboarding, capture, submission and integrity metrics for one election, inside your
        scope.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
          description: ''
  /api/v1/elections/{election_id}/config-issues:
    get:
      operationId: elections_config_issues_list
      description: |-
        GET: "party missing" / "contestant missing" tasks for admins (FR-6.3.7).
        POST: an agent reports one from the result form of an assigned unit. Neither ever creates
        or changes a party or contestant.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConfigIssueList'
          description: ''
    post:
      operationId: elections_config_issues_create
      description: |-
        GET: "party missing" / "contestant missing" tasks for admins (FR-6.3.7).
        POST: an agent reports one from the result form of an assigned unit. Neither ever creates
        or changes a party or contestant.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigIssueReportRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigIssue'
          description: ''
  /api/v1/elections/{election_id}/contestants:
    get:
      operationId: elections_contestants_list
      parameters:
      - in: query
        name: constituency_id
        schema:
          type: string
          format: uuid
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contestant'
          description: ''
    post:
      operationId: elections_contestants_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestantCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contestant'
          description: ''
  /api/v1/elections/{election_id}/coverage-timeline:
    get:
      operationId: elections_coverage_timeline_retrieve
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: interval
        schema:
          type: string
          enum:
          - hour
          - minute
      - in: query
        name: parent_id
        schema:
          type: string
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageTimeline'
          description: ''
  /api/v1/elections/{election_id}/dashboard:
    get:
      operationId: elections_dashboard_retrieve
      description: |-
        War room: every party and contestant side by side over everything the caller may see,
        with the leader status (ties and narrow margins named) and X of Y polling units reported.
        Figures are the party's own collection, not the official INEC count.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: measure
        schema:
          type: string
          enum:
          - reported
          - verified
        description: reported (every counting result) or verified (approved results
          only). Defaults to the election's count policy.
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/elections/{election_id}/flags:
    get:
      operationId: elections_flags_list
      description: Flags for an election inside the caller's scope, newest first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlagList'
          description: ''
  /api/v1/elections/{election_id}/flags/summary:
    get:
      operationId: elections_flags_summary_retrieve
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagSummary'
          description: ''
  /api/v1/elections/{election_id}/lock:
    post:
      operationId: elections_lock_create
      description: Freeze the parties and contestants (FR-6.3.3). Needs a fresh second
        factor.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
          description: ''
  /api/v1/elections/{election_id}/parties:
    get:
      operationId: elections_parties_list
      description: The contesting parties in their fixed order. PUT replaces the whole
        ordered list.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElectionParty'
          description: ''
    put:
      operationId: elections_parties_update
      description: The contesting parties in their fixed order. PUT replaces the whole
        ordered list.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - elections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectionPartiesUpdateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElectionParty'
          description: ''
  /api/v1/elections/{election_id}/polling-units/{polling_unit_id}/form:
    get:
      operationId: elections_polling_units_form_retrieve
      description: |-
        The result form for an assigned unit (FR-6.5.1, AC-16): exactly the configured parties,
        in the admin's order, each with its candidate. Read-only apart from the numbers.
      parameters:
      - in: path
        name: election_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: polling_unit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
