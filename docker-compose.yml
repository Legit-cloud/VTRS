# Local development stack only. Not used for deployment or CI.
# Credentials below are development placeholders; override them in .env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  redis-broker:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6380:6379"

  redis-channels:
    image: redis:7
    ports:
      - "6381:6379"

  # S3-compatible object storage for evidence. RustFS (Apache-2.0) replaces MinIO, whose
  # images are no longer published; it enforces x-amz-checksum-sha256 on presigned uploads.
  objectstore:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-vtrs-dev}
      RUSTFS_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-vtrs-dev-password}
    ports:
      - "9000:9000"
    volumes:
      - objectdata:/data

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  objectdata:
